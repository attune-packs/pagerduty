ref: pagerduty.escalation_policy_find
label: Escalation Policy Find
description: find escalation_policy(s) by criteria
enabled: true
runner_type: python
runtime_version: '>=3.10'
entry_point: pagerduty_action.py
parameter_delivery: stdin
parameter_format: json
output_format: json
default_execution_permission_set_refs:
- standard
parameters:
  credential_key:
    type: string
    description: Attune Key containing PagerDuty credential settings
    default: pagerduty.credentials
    required: true
  maximum:
    type: integer
    description: limit number of entries potentially returned
    default: 25
    minimum: 1
  user_ids:
    type: array
    description: array of user ids to narrow search to
  team_ids:
    type: array
    description: array of team ids to narrow search to
  include:
    description: Array of additional details to include.
    type: array
  query:
    type: string
    description: a substring search of the 'name' field
output:
  operation:
    type: string
    description: Executed PagerDuty operation
  result:
    type: any
    description: PagerDuty resource object, collection, or operation result
