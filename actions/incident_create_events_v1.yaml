ref: pagerduty.incident_create_events_v1
label: Incident Create Events V1
description: create an incident using the v1 Events API
enabled: true
runner_type: python
runtime_version: '>=3.10'
entry_point: pagerduty_action.py
parameter_delivery: stdin
parameter_format: json
output_format: json
default_execution_permission_set_refs:
- standard
parameters:
  credential_key:
    type: string
    description: Attune Key containing PagerDuty credential settings
    default: pagerduty.credentials
    required: true
  service_key:
    type: string
    description: Optional Events API v1 integration key; defaults to service_key in credential_key
    secret: true
  description:
    type: string
    description: Text that will appear in the incident's log associated with this event
    required: true
  details:
    type: object
    description: An arbitrary JSON object containing any data you'd like included in the incident log
  client:
    type: string
    description: The name of the monitoring client that is triggering this event
  client_url:
    type: string
    description: The URL of the monitoring client that is triggering this event
  incident_key:
    type: string
    description: Incident De-Dup key. See PD Events v1 API Docs for more details.
output:
  operation:
    type: string
    description: Executed PagerDuty operation
  result:
    type: any
    description: PagerDuty resource object, collection, or operation result
