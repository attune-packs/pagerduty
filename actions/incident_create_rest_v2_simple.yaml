ref: pagerduty.incident_create_rest_v2_simple
label: Incident Create Rest V2 Simple
description: create an incident using the v2 REST API (simplified)
enabled: true
runner_type: python
runtime_version: '>=3.10'
entry_point: pagerduty_action.py
parameter_delivery: stdin
parameter_format: json
output_format: json
default_execution_permission_set_refs:
- standard
parameters:
  credential_key:
    type: string
    description: Attune Key containing PagerDuty credential settings
    default: pagerduty.credentials
    required: true
  from_email:
    type: string
    description: The email address of a valid user associated with the account making the request.
    required: true
  title:
    type: string
    description: A succinct description of the nature, symptoms, cause, or effect of the incident.
    required: true
  service_id:
    type: string
    description: The incident will be created on this service.
    required: true
  details:
    type: string
    description: Details for the incident
output:
  operation:
    type: string
    description: Executed PagerDuty operation
  result:
    type: any
    description: PagerDuty resource object, collection, or operation result
