ref: pagerduty.incident_find_log_entries
label: Incident Find Log Entries
description: find log_entries for an incident by entity_id
enabled: true
runner_type: python
runtime_version: '>=3.10'
entry_point: pagerduty_action.py
parameter_delivery: stdin
parameter_format: json
output_format: json
default_execution_permission_set_refs:
- standard
parameters:
  credential_key:
    type: string
    description: Attune Key containing PagerDuty credential settings
    default: pagerduty.credentials
    required: true
  entity_id:
    type: string
    description: translates to the 'id' key for an incident object in PagerDuty
    required: true
  time_zone:
    type: string
    description: Time zone in which dates in the result will be rendered.
    default: UTC
  is_overview:
    type: boolean
    description: If true, will return a subset of log entries that show only the most important changes to the incident.
    default: false
  include:
    type: array
    description: Array of additional details to include.
output:
  operation:
    type: string
    description: Executed PagerDuty operation
  result:
    type: any
    description: PagerDuty resource object, collection, or operation result
