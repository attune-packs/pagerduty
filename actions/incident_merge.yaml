ref: pagerduty.incident_merge
label: Incident Merge
description: merge incidents into entity_id
enabled: true
runner_type: python
runtime_version: '>=3.10'
entry_point: pagerduty_action.py
parameter_delivery: stdin
parameter_format: json
output_format: json
default_execution_permission_set_refs:
- standard
parameters:
  credential_key:
    type: string
    description: Attune Key containing PagerDuty credential settings
    default: pagerduty.credentials
    required: true
  from_email:
    type: string
    description: The email address of a valid user associated with the account making the request.
    required: true
  entity_id:
    type: string
    description: translates to the 'id' key for an incident object in PagerDuty
    required: true
  source_incidents:
    type: array
    description: array of incident ids to be merged into the target incident (entity_id) and resolved
    required: true
output:
  operation:
    type: string
    description: Executed PagerDuty operation
  result:
    type: any
    description: PagerDuty resource object, collection, or operation result
