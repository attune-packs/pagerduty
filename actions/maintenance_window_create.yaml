ref: pagerduty.maintenance_window_create
label: Maintenance Window Create
description: create an maintenance_window (raw data input)
enabled: true
runner_type: python
runtime_version: '>=3.10'
entry_point: pagerduty_action.py
parameter_delivery: stdin
parameter_format: json
output_format: json
default_execution_permission_set_refs:
- standard
parameters:
  credential_key:
    type: string
    description: Attune Key containing PagerDuty credential settings
    default: pagerduty.credentials
    required: true
  from_email:
    type: string
    description: The email address of a valid user associated with the account making the request.
    required: true
  data:
    type: object
    description: A JSON object with the data that should be sent for incident creation. See action definition for
      details (JSONSchema).
    properties:
      type:
        type: string
        default: maintenance_window
        enum:
        - maintenance_window
        - maintenance_window_reference
      start_time:
        type: string
        description: This maintenance window's start time. This is when the services will stop creating incidents.
          If this date is in the past, it will be updated to be the current time. (ISO8601 compliant timestamp)
      end_time:
        type: string
        description: This maintenance window's end time. This is when the services will start creating incidents
          again. This date must be in the future and after the `start_time`. (ISO8601 compliant timestamp)
      description:
        type: string
        description: A description for this maintenance window.
      services:
        type: array
        description: Services associated with the maintenance window.
        items:
          type: object
          properties:
            id:
              type: string
              description: service id
            type:
              type: string
              description: the type of the service
              default: service_reference
              enum:
              - service
              - service_reference
          required:
          - id
          - type
    required: true
output:
  operation:
    type: string
    description: Executed PagerDuty operation
  result:
    type: any
    description: PagerDuty resource object, collection, or operation result
