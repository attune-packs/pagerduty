ref: pagerduty.schedule_create
label: Schedule Create
description: create a schedule
enabled: true
runner_type: python
runtime_version: '>=3.10'
entry_point: pagerduty_action.py
parameter_delivery: stdin
parameter_format: json
output_format: json
default_execution_permission_set_refs:
- standard
parameters:
  credential_key:
    type: string
    description: Attune Key containing PagerDuty credential settings
    default: pagerduty.credentials
    required: true
  overflow:
    type: boolean
    description: See API PagerDuty API Docs
    default: false
  data:
    type: object
    description: A JSON object with the data that should be sent for schedule creation. See action definition for
      details (JSONSchema).
    properties:
      type:
        type: string
        default: schedule
        enum:
        - schedule
        - schedule_reference
      time_zone:
        type: string
        description: The time zone of the schedule.
        default: America/Los_Angeles
      name:
        type: string
        description: The name of the schedule
      description:
        type: string
        description: A description for the schedule
      schedule_layers:
        type: array
        description: A list of schedule layers.
        items:
          type: object
          properties:
            start:
              type: string
              description: The start time of this layer. (ISO8601 compliant timestamp)
            end:
              type: string
              description: The end time of this layer. (ISO8601 compliant timestamp)
            rotation_virtual_start:
              type: string
              description: The effective start time of the layer. This can be before the start time of the schedule.
                (ISO8601 compliant timestamp)
            rotation_turn_length_seconds:
              type: integer
              description: The duration of each on-call shift in seconds.
              default: 604800
            name:
              type: string
              description: The name of the schedule layer.
            users:
              type: array
              description: The ordered list of users on this layer. The position of the user on the list determines
                their order in the layer.
              items:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                        description: id of the user
                      type:
                        type: string
                        description: user type
                        enum:
                        - user
                        - user_reference
                    required:
                    - id
                    - type
                required:
                - user
            restrictions:
              type: array
              description: An array of restrictions for the layer. A restriction is a limit on which period of the
                day or week the schedule layer can accept assignments.
              items:
                type: object
                properties:
                  type:
                    type: string
                    description: Specify the types of `restriction`.
                    enum:
                    - daily_restriction
                    - weekly_restriction
                  duration_seconds:
                    type: integer
                    description: The duration of the restriction in seconds.
                  start_time_of_day:
                    type: string
                    description: The start time in HH:mm:ss format.
                  start_day_of_week:
                    type: integer
                    description: Only required for use with a `weekly_restriction` restriction type. The first day
                      of the weekly rotation schedule as [ISO 8601 day]
                required:
                - type
                - duration_seconds
                - start_time_of_day
          required:
          - start
          - rotation_virtual_start
          - rotation_turn_length_seconds
          - users
    required: true
output:
  operation:
    type: string
    description: Executed PagerDuty operation
  result:
    type: any
    description: PagerDuty resource object, collection, or operation result
