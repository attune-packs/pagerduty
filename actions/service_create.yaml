ref: pagerduty.service_create
label: Service Create
description: create a service (raw data input)
enabled: true
runner_type: python
runtime_version: '>=3.10'
entry_point: pagerduty_action.py
parameter_delivery: stdin
parameter_format: json
output_format: json
default_execution_permission_set_refs:
- standard
parameters:
  credential_key:
    type: string
    description: Attune Key containing PagerDuty credential settings
    default: pagerduty.credentials
    required: true
  from_email:
    type: string
    description: The email address of a valid user associated with the account making the request.
    required: true
  data:
    type: object
    description: A JSON object with the data that should be sent for service creation. See action definition for
      details (JSONSchema).
    properties:
      type:
        type: string
        default: user
        enum:
        - service
        - service_reference
      name:
        type: string
        description: The name of the service.
      description:
        type: string
        description: The user-provided description of the service.
      auto_resolve_timeout:
        type: integer
        description: Time in seconds that an incident is automatically resolved if left open for that long (0 or
          null = disable feature)
      acknowledgement_timeout:
        type: integer
        description: Time in seconds that an incident changes to the Triggered State after being Acknowledged. (0
          or null = disable feature)
      status:
        type: string
        description: The current state of the Service.
        enum:
        - active
        - warning
        - critical
        - maintenance
        - disabled
      alert_creation:
        type: string
        description: Whether a service creates only incidents, or both alerts and incidents.
        enum:
        - create_incidents
        - create_alerts_and_incidents
      alert_grouping:
        type: string
        description: Defines how alerts on this service will be automatically grouped into incidents.
        enum:
        - time
        - intelligent
      alert_grouping_timeout:
        type: integer
        description: The duration in minutes within which to automatically group incoming alerts. (0 = Continue
          grouping until resolved)
      escalation_policy:
        type: object
        description: The escalation policy used by this service.
        properties:
          id:
            type: string
            description: id of the escalation policy
          type:
            type: string
            description: type of the escalation policy
            enum:
            - escalation_policy
            - escalation_policy_reference
        required:
        - id
      incident_urgency_rule:
        type: object
        description: The default urgency for new incidents. Account must have the `urgencies` ability to assign
          a incident urgency rule.
        properties:
          type:
            type: string
            description: The type of incident urgency
            enum:
            - constant
            - use_support_hours
          urgency:
            type: string
            description: The incidents' urgency, if type is constant.
            enum:
            - low
            - high
          during_support_hours:
            type: object
            description: Incidents' urgency during support hours
            properties:
              type:
                type: string
                description: The type of incident urgency
                enum:
                - constant
              urgency:
                type: string
                description: The incidents' urgency, if type is constant.
                enum:
                - low
                - high
          outside_support_hours:
            type: object
            description: Incidents' urgency during support hours
            properties:
              type:
                type: string
                description: The type of incident urgency
                enum:
                - constant
              urgency:
                type: string
                description: The incidents' urgency, if type is constant.
                enum:
                - low
                - high
      support_hours:
        type: object
        description: The support hours for the service.
        properties:
          type:
            type: string
            description: The type of support hours
            enum:
            - fixed_time_per_day
          time_zone:
            type: string
            description: The time zone for the support hours (America/New_York)
          start_time:
            type: string
            description: The support hours' starting time of day (date portion is ignored) (HH:mm:ss format)
          end_time:
            type: string
            description: The support hours' ending time of day (date portion is ignored) (HH:mm:ss format)
          days_of_week:
            type: array
            description: array of days of week support hours apply [ISO 8601 day]
      scheduled_actions:
        type: array
        description: An array containing scheduled actions for the service.
        items:
          type: object
          properties:
            type:
              type: string
              description: The type of schedule action. Must be set to urgency_change.
              default: urgency_change
              enum:
              - urgency_change
            to_urgency:
              type: string
              description: Urgency level. Must be set to high.
              default: high
              enum:
              - high
            at:
              type: object
              description: Represents when scheduled action will occur.
              properties:
                type:
                  type: string
                  description: Must be set to named_time.
                  default: named_time
                  enum:
                  - named_time
                name:
                  type: string
                  description: Designates either the start or the end of support hours.
                  enum:
                  - support_hours_start
                  - support_hours_end
              required:
              - type
              - name
          required:
          - type
          - to_urgency
          - at
    required: true
output:
  operation:
    type: string
    description: Executed PagerDuty operation
  result:
    type: any
    description: PagerDuty resource object, collection, or operation result
