ref: pagerduty.team_remove_escalation_policy
label: Team Remove Escalation Policy
description: remove escalation by id from a team by entity_id
enabled: true
runner_type: python
runtime_version: '>=3.10'
entry_point: pagerduty_action.py
parameter_delivery: stdin
parameter_format: json
output_format: json
default_execution_permission_set_refs:
- standard
parameters:
  credential_key:
    type: string
    description: Attune Key containing PagerDuty credential settings
    default: pagerduty.credentials
    required: true
  entity_id:
    type: string
    description: translates to the 'id' key for a team object in PagerDuty
    required: true
  escalation_policy:
    type: string
    description: translates to the 'id' key for an escalation_policy object in PagerDuty
    required: true
output:
  operation:
    type: string
    description: Executed PagerDuty operation
  result:
    type: any
    description: PagerDuty resource object, collection, or operation result
