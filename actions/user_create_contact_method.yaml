ref: pagerduty.user_create_contact_method
label: User Create Contact Method
description: create a contact_method for user by entity_id  (raw data input)
enabled: true
runner_type: python
runtime_version: '>=3.10'
entry_point: pagerduty_action.py
parameter_delivery: stdin
parameter_format: json
output_format: json
default_execution_permission_set_refs:
- standard
parameters:
  credential_key:
    type: string
    description: Attune Key containing PagerDuty credential settings
    default: pagerduty.credentials
    required: true
  entity_id:
    type: string
    description: translates to the 'id' key for a user object in PagerDuty
    required: true
  data:
    type: object
    description: A JSON object with the data that should be sent for contact_method creation. See action definition
      for details (JSONSchema).
    properties:
      type:
        type: string
        description: The type of contact method
        enum:
        - email_contact_method
        - phone_contact_method
        - push_notification_contact_method
        - sms_contact_method
      label:
        type: string
        description: The label (e.g., "Work", "Mobile", etc.).
      address:
        type: string
        description: 'The ''address'' to deliver to: email, phone number, etc., depending on the type.'
    required: true
output:
  operation:
    type: string
    description: Executed PagerDuty operation
  result:
    type: any
    description: PagerDuty resource object, collection, or operation result
