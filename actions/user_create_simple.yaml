ref: pagerduty.user_create_simple
label: User Create Simple
description: create a user (simplified)
enabled: true
runner_type: python
runtime_version: '>=3.10'
entry_point: pagerduty_action.py
parameter_delivery: stdin
parameter_format: json
output_format: json
default_execution_permission_set_refs:
- standard
parameters:
  credential_key:
    type: string
    description: Attune Key containing PagerDuty credential settings
    default: pagerduty.credentials
    required: true
  from_email:
    type: string
    description: The email address of a valid user associated with the account making the request.
    required: true
  type:
    type: string
    default: user
    enum:
    - user
    - user_reference
    required: true
  name:
    type: string
    description: The name of the user.
    required: true
  email:
    type: string
    description: The user's email address.
    required: true
  time_zone:
    type: string
    description: The preferred time zone name. If null, the account's time zone will be used.
    default: America/Los_Angeles
  color:
    type: string
    description: The color this user will appear as on schedules.
    default: grey20
    enum:
    - purple
    - red
    - green
    - blue
    - teal
    - orange
    - brown
    - turquoise
    - dark-slate-blue
    - cayenne
    - orange-red
    - dark-orchid
    - dark-slate-grey
    - lime
    - dark-magenta
    - lime-green
    - midnight-blue
    - deep-pink
    - dark-green
    - dark-orange
    - dark-cyan
    - darkolive-green
    - dark-slate-gray
    - grey20
    - firebrick
    - maroon
    - crimson
    - dark-red
    - dark-goldenrod
    - chocolate
    - medium-violet-red
    - sea-green
    - olivedrab
    - forest-green
    - dark-olive-green
    - blue-violet
    - royal-blue
    - indigo
    - slate-blue
    - saddle-brown
    - steel-blue
  role:
    type: string
    description: The user's role (as defined in PagerDuty)
    default: user
    enum:
    - read_only_user
    - owner
    - admin
    - user
    - observer
    - limited_user
    - team_responder
    - restricted_access
  description:
    type: string
    description: The user's bio.
  job_title:
    type: string
    description: The user's displayed Job Title
output:
  operation:
    type: string
    description: Executed PagerDuty operation
  result:
    type: any
    description: PagerDuty resource object, collection, or operation result
