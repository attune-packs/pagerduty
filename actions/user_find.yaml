ref: pagerduty.user_find
label: User Find
description: find users by criteria
enabled: true
runner_type: python
runtime_version: '>=3.10'
entry_point: pagerduty_action.py
parameter_delivery: stdin
parameter_format: json
output_format: json
default_execution_permission_set_refs:
- standard
parameters:
  credential_key:
    type: string
    description: Attune Key containing PagerDuty credential settings
    default: pagerduty.credentials
    required: true
  maximum:
    type: integer
    description: limit number of entries potentially returned
    default: 25
    minimum: 1
  team_ids:
    type: array
    description: array of team ids to narrow search to
  query:
    type: string
    description: a substring search of the 'name' and 'email' field
output:
  operation:
    type: string
    description: Executed PagerDuty operation
  result:
    type: any
    description: PagerDuty resource object, collection, or operation result
