ref: pagerduty
label: "PagerDuty"
description: "PagerDuty REST API v2 and legacy Events API v1 actions"
version: "0.1.0"
author: "Attune; adapted from work by Aamir, Jon Middleton, and Ian Price"
email: "support@attune.systems"
system: false
enabled: true

conf_schema: {}
config: {}

meta:
  category: integration
  documentation_url: "https://developer.pagerduty.com/api-reference/"
  repository_url: "https://github.com/attune-packs/pagerduty"
  source_version: "2.0.0 (4555dfc3f5fdbc1486503149c86392a1d5bf24b8)"
  license: "Apache-2.0"

tags: [pagerduty, incidents, on-call, integration]
runtime_deps: [python]
dependencies: []

testing:
  enabled: true
  discovery:
    method: directory
    path: tests
  runners:
    python:
      type: unittest
      entry_point: tests/test_pack.py
      timeout: 120
      result_format: simple
  min_pass_rate: 1.0
  on_failure: block
